<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Secure Connect – Chat test client</title>
<script src="/socket.io/socket.io.js"></script>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
  input, button { padding: .5rem; margin: .25rem 0; }
  #log { border: 1px solid #888; height: 260px; overflow-y: auto; padding: .5rem; margin: .5rem 0; }
  #chat { display: none; }
</style>
</head>
<body>
<h2>Secure Connect – chat test client</h2>
<div id="auth">
  <input id="email" placeholder="email" type="email"><br>
  <input id="password" placeholder="password" type="password"><br>
  <button id="login">Log in</button> <span id="status"></span>
</div>
<div id="chat">
  <div id="log"></div>
  <input id="room" value="general" size="10"> <button id="join">Join room</button><br>
  <input id="text" placeholder="Type a message" size="40"> <button id="send">Send</button>
</div>
<script>
const $ = (id) => document.getElementById(id);
let socket;

function addLine(text) {
  const p = document.createElement('div');
  p.textContent = text;           // textContent, not innerHTML: no XSS from chat messages
  $('log').appendChild(p);
  $('log').scrollTop = $('log').scrollHeight;
}

$('login').onclick = async () => {
  const res = await fetch('/api/auth/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: $('email').value, password: $('password').value }),
  });
  const data = await res.json();
  $('status').textContent = data.message;
  if (!res.ok) return;

  $('auth').style.display = 'none';
  $('chat').style.display = 'block';
  socket = io({ auth: { token: data.token } });
  socket.on('connect_error', (e) => addLine('Connection error: ' + e.message));
  socket.on('history', ({ room, messages }) => messages.forEach((m) => addLine(`[${room}] ${m.username}: ${m.text}`)));
  socket.on('message', (m) => addLine(`[${m.room}] ${m.username}: ${m.text}`));
  socket.on('system', (m) => addLine(`* [${m.room}] ${m.text}`));
  socket.on('error_message', (m) => addLine('! ' + m.message));
};

$('join').onclick = () => socket.emit('joinRoom', $('room').value);
$('send').onclick = () => {
  socket.emit('chatMessage', { room: $('room').value, text: $('text').value });
  $('text').value = '';
};
$('text').onkeydown = (e) => { if (e.key === 'Enter') $('send').click(); };
</script>
</body>
</html>
